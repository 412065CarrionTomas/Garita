name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Restaurar caché de Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Verificar formato
        run: pnpm format:check

      - name: Lint, tipos, tests y build
        run: pnpm turbo run lint typecheck test build

  api-e2e:
    name: Tests de integración de la API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: garita
          POSTGRES_PASSWORD: garita
          POSTGRES_DB: garita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garita -d garita_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://garita:garita@localhost:5432/garita_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar dependencias internas y generar el cliente de Prisma
        run: pnpm turbo run build --filter=api^... && pnpm --filter api db:generate

      - name: Aplicar migraciones
        run: pnpm --filter api db:deploy

      - name: Cargar datos de prueba
        run: pnpm --filter api db:seed

      - name: Tests de integración
        run: pnpm --filter api test:e2e
