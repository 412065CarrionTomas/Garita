version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-y-parches:
        update-types: [minor, patch]
    ignore:
      # Las versiones de Expo, React Native y React las fija el SDK: se actualizan con `expo install --fix`.
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: react-native
      - dependency-name: react-native-*
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-async-storage/*'
      # React Native exige la versión exacta de React del SDK; la web y la app comparten el nombre del paquete.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: '@types/react'
      # jest-expo usa jest 29; los tipos de Node siguen al runtime (.nvmrc).
      - dependency-name: jest
        update-types: [version-update:semver-major]
      - dependency-name: '@types/jest'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # firebase-admin 14 depreca el envío por token FCM en favor de FIDs: requiere migrar el registro de dispositivos.
      - dependency-name: firebase-admin
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
