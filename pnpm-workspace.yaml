packages:
  - apps/*
  - packages/*

# Versiones compartidas entre los paquetes del monorepo (se referencian con "catalog:").
catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^24.19.1
  eslint: ^10.12.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.13.0
  jest: ^30.5.2
  typescript: ~6.0.3
  typescript-eslint: ^8.71.1
  zod: ^4.6.5

# Dependencias autorizadas a ejecutar scripts de instalación.
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  unrs-resolver: true

# Paquetes de Expo SDK 57 publicados antes de cumplir la antigüedad mínima que exige pnpm.
# Se pueden quitar una vez que esas versiones superen minimumReleaseAge.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - '@expo/ui@57.0.22'
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-linking@57.0.12
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - expo-router@57.0.25
  - expo@57.0.27
